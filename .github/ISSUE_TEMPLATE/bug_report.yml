name: Bug report
description: Report an application problem using a sanitized example.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please omit API keys, private conversations, database files, backups and model downloads. Report security concerns through SECURITY.md."
  - type: input
    id: version
    attributes:
      label: App version and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "What did you do, what did you expect, and what happened?"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model, if relevant
      description: "Names only; never include API keys or private endpoint credentials."
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: "Optional screenshots or short error excerpts with personal information removed."
